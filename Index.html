<!DOCTYPE html>

<head>

    <title>Randi Fashion - Online Store</title>
    <style>
        :root { --primary-color: #ff4757; --secondary-color: #2f3542; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f1f2f6; }
        header { background-color: var(--secondary-color); color: white; padding: 20px; text-align: center; }
        .container { max-width: 1000px; margin: auto; padding: 20px; display: flex; flex-wrap: wrap; justify-content: center; }
        
        /* Product Card Design */
        .card { background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: 15px; width: 280px; overflow: hidden; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 250px; object-fit: cover; background-color: #eee; }
        .card-info { padding: 15px; text-align: center; }
        .price { color: var(--primary-color); font-size: 1.2rem; font-weight: bold; margin: 10px 0; }
        
        /* WhatsApp Button */
        .buy-btn { background-color: #25D366; color: white; text-decoration: none; padding: 10px 20px; border-radius: 25px; display: inline-block; font-weight: bold; transition: 0.3s; }
        .buy-btn:hover { background-color: #128C7E; }
        
        footer { background: #2f3542; color: white; text-align: center; padding: 10px; margin-top: 20px; }
    </style>
</head>
